<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Standar dan Prosedur UNTAR</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dfe3ea;--ac:#1f5fbf;--acbg:#e8f0fc;--ok:#16794a;--wr:#8a5a00;--wrbg:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2d3744;--ac:#6ea3f0;--acbg:#1f2e47;--ok:#5fd09a;--wr:#f0c060;--wrbg:#3a2f14}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2d3744;--ac:#6ea3f0;--acbg:#1f2e47;--ok:#5fd09a;--wr:#f0c060;--wrbg:#3a2f14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,button,textarea{font:inherit;color:var(--tx)}
input[type=search],.ed input{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
#q{flex:1;min-width:200px}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border-radius:999px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.st b{display:block;font-size:20px}.st span{color:var(--mu);font-size:12px}
.pr{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px;min-width:120px}.pr i{display:block;height:100%;background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:8px;justify-content:space-between;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:400;color:var(--mu);white-space:nowrap}
.bd{padding:0 14px 12px;border-top:1px solid var(--bd)}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
li:last-child{border:0}
li.g{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;border:0;padding:10px 0 2px}
.t{flex:1;min-width:0}
a.go{background:var(--acbg);color:var(--ac);border-radius:6px;padding:3px 9px;text-decoration:none;font-size:13px;white-space:nowrap}
a.go.big{display:inline-block;margin-top:10px;padding:6px 12px}
.no{background:var(--wrbg);color:var(--wr);border-radius:6px;padding:3px 9px;font-size:12px;white-space:nowrap}
li.ed{flex-wrap:wrap}.ed input{padding:5px 8px;font-size:13px}
.ed .ig{width:100%}.ed .it{flex:1 1 180px}.ed .iu{flex:1 1 180px}
.x{padding:3px 8px;color:#c0392b}
.add{margin-top:8px;font-size:13px;color:var(--ac)}
.hd{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.hd input{flex:1 1 160px}
.empty{color:var(--mu);padding:30px;text-align:center}
.w{--tc:#1f5fbf}
.tabs button.on{background:var(--tc);border-color:var(--tc);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.7)}
details{border-top:4px solid var(--tc)}
a.go{background:color-mix(in srgb,var(--tc) 15%,transparent);color:color-mix(in srgb,var(--tc) 75%,var(--tx))}
.st{border-left:4px solid var(--tc)}
.pr i{background:var(--tc)}
li.g{color:color-mix(in srgb,var(--tc) 75%,var(--tx))}
.cl{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}
.cl input{width:38px;height:32px;padding:0;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(640px,92vw)}
dialog textarea{width:100%;height:260px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;font:12px monospace}
</style>
</head>
<body>
<div class="w">
<h1>Dashboard Standar dan Prosedur UNTAR</h1>
<p class="sub">Cari standar atau prosedur, lalu klik <b>Buka</b> untuk menuju dokumennya.</p>
<div class="bar">
<input type="search" id="q" placeholder="Cari bidang, standar, atau prosedur…">
<label class="cl">Warna tab<input type="color" id="tc"></label>
<button id="be">✎ Mode Edit</button>
<button id="bk">Backup / Restore</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"></div>
<button class="add" id="ab" style="display:none">+ Tambah Bidang</button>
</div>
<dialog id="dlg">
<p><b>Backup / Restore</b><br><small>Salin teks di bawah untuk menyimpan data. Untuk memulihkan, tempel data lalu klik Terapkan.</small></p>
<textarea id="ta"></textarea>
<p style="display:flex;gap:8px;flex-wrap:wrap"><button id="cp">Salin</button><button id="ap">Terapkan</button><button id="sd">Data awal</button><button id="cl">Tutup</button></p>
</dialog>
<script>
const K="dash_standar_v1";
const TL=["3. Strategi Pencapaian Standar","4. Strategi Penanganan Ketidaktercapaian Standar","5. Pihak Terkait","6. Dokumen Terkait","7. Referensi"];
const G=(g,...a)=>a.map(x=>g+"|"+x);
const N=(g,p,...a)=>a.map((x,i)=>g+"|"+p+(i+1)+" "+x);
const DI=(n,p="Persyaratan Standar & Indikator")=>[n+" – Definisi",n+" – "+p];
const I2="2. Isi Standar",R1="1. Rasional Standar";
const B=(n,a)=>({n,u:"",items:a.flat().map(s=>{const k=s.indexOf("|");return k<0?{g:"",t:s,u:""}:{g:s.slice(0,k),t:s.slice(k+1),u:""}})});
const K3=["Luaran","Proses","Masukan"];
const RS=x=>B(x,[R1,G(I2,...DI("2.1 Standar Luaran "+x),...DI("2.2 Standar Proses "+x),...DI("2.3 Standar Masukan "+x)),
G("3. Strategi Pencapaian Standar",...K3.map((k,i)=>"3."+(i+1)+" Strategi Pencapaian Standar "+k+" "+x)),
G("4. Strategi Penanganan Ketidaktercapaian Standar",...K3.map((k,i)=>"4."+(i+1)+" Strategi Penanganan Ketidaktercapaian Standar "+k+" "+x)),
G("5. Pihak Terkait",...K3.map((k,i)=>"5."+(i+1)+" Pihak Terkait Standar "+k+" "+x)),"6. Dokumen Terkait","7. Referensi"]);
const L=(n,s)=>B(n,[R1,G(I2,...DI(s)),TL]);
const seed=()=>[
{id:"na",c:"#1f5fbf",name:"Standar Non Akademik",b:[
B("A. STANDAR KEMAHASISWAAN & ALUMNI",[R1,G(I2,...DI("2.1 Standar Kemahasiswaan","Pernyataan Standar dan Indikator"),...DI("2.2 Standar Alumni","Pernyataan Standar dan Indikator")),TL]),
B("B. STANDAR PEMERINGKATAN",[R1,G(I2,...DI("2.1 Standar Pemeringkatan UNTAR")),TL]),
B("C. STANDAR KERJASAMA & HUBUNGAN INTERNASIONAL",[R1,G(I2,...DI("2.1.1 Standar Pembuatan Kerja Sama"),...DI("2.1.2 Standar Pelaksanaan Kerja Sama"),...DI("2.1.3 Standar Evaluasi dan Tindak Lanjut Kerja Sama"),...DI("2.2.1 Standar Perencanaan Pertukaran Mahasiswa"),...DI("2.2.2 Standar Pelaksanaan Pertukaran Mahasiswa"),...DI("2.2.3 Standar Evaluasi dan Tindak Lanjut Pertukaran Mahasiswa")),TL]),
B("D. STANDAR PENDIDIKAN & PELATIHAN",[R1,G("2. Standar & Indikator",...DI("2.1 Standar Pendidikan dan Pelatihan")),TL]),
B("E. STANDAR PUSDATIN",[R1,G(I2,...DI("Standar Pusdatin")),TL]),
B("F. STANDAR HUBUNGAN MASYARAKAT & MULTIMEDIA",[R1,G(I2,...DI("Standar Humas & Multimedia"))]),
B("G. STANDAR REKTORAT",[R1,G(I2,...["2.1 Standar Penyusunan Laporan","2.2 Standar Tata Pamong","2.3 Standar Pengendalian Layanan / Produk Yang Tidak Sesuai","2.4 Standar Tindakan Koreksi dan/atau Pencegahan","2.5 Standar Prosedur Tinjauan Manajemen","2.6 Standar Pemusnahan Berkas","2.7 Standar Penyusunan Rencana Strategis dan Rencana Operasional","2.8 Standar Penyusunan Program Kerja dan Anggaran","2.9 Standar Monitoring & Evaluasi Renstra, Renop & Program Kerja","2.10 Standar Pengelolaan Manajemen Risiko","2.11 Standar Pengelolaan Rapat"].flatMap(x=>DI(x))),
G("3. Strategi Pencapaian Standar","3.1 Pengendalian Dokumen Pelaksanaan & Strategis","3.2 Pengendalian Rekaman","3.3 Pengendalian Layanan / Produk yang Tidak Sesuai","3.4 Tindakan Koreksi dan/atau Pencegahan","3.5 Prosedur Tinjauan Manajemen","3.6 Pemusnahan Berkas","3.7 Penyusunan Rencana Strategis dan Rencana Operasional","3.8 Penyusunan Program Kerja dan Anggaran","3.9 Monitoring & Evaluasi Renstra, Renop & Program Kerja","3.10 Pengelolaan Manajemen Risiko","3.11 Pengelolaan Rapat"),
TL.slice(1)]),
L("H. STANDAR KOLEKSI PERPUSTAKAAN","Standar Koleksi Perpustakaan"),
L("I. STANDAR PELAYANAN (PERPUSTAKAAN)","Standar Pelayanan Perpustakaan"),
L("J. STANDAR PROTOKOL & HUBUNGAN KELEMBAGAAN","Standar Protokol & Hubungan Kelembagaan")]},
{id:"ak",c:"#16794a",name:"Standar Akademik",b:[
B("PENDIDIKAN",[R1,G(I2,...DI("2.1 Standar Luaran Pendidikan","Pernyataan Standar dan Indikator"),"2.2.1 Standar Proses Pembelajaran","2.2.2 Standar Penilaian Pembelajaran","2.3.1 Standar Isi Pendidikan","2.3.2 Standar Dosen dan Tenaga Kependidikan","2.3.3 Standar Sarana dan Prasarana Pendidikan","2.3.4 Standar Pembiayaan Pendidikan"),
G("3. Strategi Pencapaian Standar","3.1 Luaran Pendidikan","3.2.1 Standar Proses Pembelajaran","3.2.2 Standar Penilaian","3.2.3 Standar Pengelolaan","3.3.1 Standar Isi Pendidikan","3.3.2 Standar Dosen dan Tenaga Kependidikan","3.3.3 Standar Sarana & Prasarana Pendidikan","3.3.4 Standar Pembiayaan Pendidikan"),
G("4. Strategi Penanganan Ketidaktercapaian Standar","4.1 Luaran Pendidikan","4.2.1 Standar Proses Pembelajaran","4.2.2 Standar Penilaian","4.2.3 Standar Pengelolaan","4.3.1 Standar Isi Pendidikan","4.3.2 Standar Dosen dan Tenaga Kependidikan","4.3.3 Standar Sarana dan Prasarana Pendidikan","4.3.4 Standar Pembiayaan Pendidikan"),
"5. Pihak Terkait","6. Dokumen Terkait","7. Referensi"]),
RS("PENELITIAN"),RS("PkM")]},
{id:"pr",c:"#c2571a",name:"Prosedur & Manual",b:[
B("PENDIDIKAN",[G("A.1 Kompetensi Lulusan","A.1.1 Prosedur Kompetensi Lulusan"),
N("A.2.1 Prosedur Proses Pembelajaran","A.2.1.","Prosedur Alur Registrasi Mahasiswa Baru","Prosedur Permintaan Kode Mata Kuliah","Prosedur Permintaan Kode Mata Kuliah","Prosedur Proses Pembelajaran","Prosedur Registrasi Rencana Studi (RRS)"),
N("A.2.2 Prosedur Penilaian","A.2.2.","Prosedur Penilaian Pembelajaran","Prosedur Cuti Akademik"),
N("A.2.3 Prosedur Pengelolaan","A.2.3.","Prosedur Aktif Kuliah Kembali","Prosedur Pengelolaan Pembelajaran","Prosedur Penanganan Mahasiswa Terancam Drop Out (DO)","Prosedur Pindah Internal dan Eksternal","Cuti Akademik","Prosedur Undur Diri","Prosedur Cuti Akademik","Prosedur Surat Keterangan Penguji Doktor","Prosedur Pencetakan Ijazah","Prosedur Pencetakan Lampiran Ijazah","Prosedur Legalisir Ijazah","Prosedur Kerja Permintaan Data"),
N("A.3.1 Prosedur Isi","A.3.1.","Prosedur Kalender Akademik","Prosedur SKR Kurikulum Operasional"),
G("A.3.2 Prosedur Dosen dan Tenaga Kependidikan","A.3.2.1 Prosedur Dosen dan Tenaga Kependidikan"),
G("A.3.3 Prosedur Sarana dan Prasarana","A.3.3.1 Prosedur Sarana dan Prasarana"),
G("A.3.4 Prosedur Pembiayaan Pembelajaran","A.3.4.1 Prosedur Pembiayaan Pembelajaran")]),
B("PENELITIAN",[N("B.1 Prosedur Kerja Luaran Penelitian","B.1.",...Array(4).fill("Prosedur Publikasi Artikel Jurnal Nasional Terakreditasi, Nasional Belum Terakreditasi dan Internasional Belum Terakreditasi")),
N("B.2 Prosedur Kerja Proses Penelitian","B.2.",...Array(5).fill("Prosedur Penelitian Skema Reguler dan Portofolio")),
N("B.3 Prosedur Kerja Masukan Penelitian","B.3.",...Array(4).fill("Prosedur Pendanaan Penelitian Internal dan Eksternal"))]),
B("PkM",[N("C.1 Prosedur Kerja Luaran Pengabdian kepada Masyarakat","C.1.","Prosedur Publikasi Artikel Jurnal Nasional Terakreditasi, Nasional belum terakreditasi, dan Internasional belum terakreditasi","Prosedur Kerja Publikasi Artikel Prosiding Internasional","Prosedur Kerja Pelaksanaan Seminar Internasional dan Nasional","Prosedur Kerja Pengajuan HKI (Hak Cipta)","Pelaksanaan Skema PKM Reguler dan Portofolio","Pelaksanaan Skema PKM 100 Plus","Pelaksanaan Skema Internasional","Pelaksanaan Skema PKM Fasilitasi dan Pendamping","Pelaksanaan Skema PKM Fasilitasi dan Pendamping","Prosedur Pendanaan Pengabdian kepada Masyarakat Internal dan Eksternal","Prosedur Penggantian Biaya Publikasi di Jurnal dan/atau Prosiding Terindeks Scopus","Prosedur Penggantian Biaya Penerbitan Buku","Prosedur Pelaksanaan Workshop, Pendampingan, Sosialisasi dan Pelatihan terkait Luaran dan Proses Pengabdian kepada Masyarakat")])]}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=u=>/^https?:\/\//i.test(u||"");
let S,tab,edit=false,q="";const open=new Set();
try{const x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}
if(!Array.isArray(S)||!S.length)S=seed();
tab=S[0].id;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const cur=()=>S.find(t=>t.id===tab)||S[0];
const tcol=x=>/^#[0-9a-f]{6}$/i.test(x.c||"")?x.c:({na:"#1f5fbf",ak:"#16794a",pr:"#c2571a"}[x.id]||"#1f5fbf");
function render(){
 const t=cur(),ql=q.trim().toLowerCase();
 $(".w").style.setProperty("--tc",tcol(t));$("#tc").value=tcol(t);
 $("#tabs").innerHTML=S.map(x=>`<button class="${x.id===tab?"on":""}" style="--tc:${tcol(x)}" data-a="tab" data-id="${esc(x.id)}"><i class="dot" style="background:${tcol(x)}"></i>${esc(x.name)}</button>`).join("");
 let tot=0,lk=0;t.b.forEach(b=>b.items.forEach(i=>{tot++;if(ok(i.u))lk++}));
 const pc=tot?Math.round(lk/tot*100):0;
 $("#stats").innerHTML=`<div class="st"><b>${t.b.length}</b><span>Bidang</span></div><div class="st"><b>${tot}</b><span>Item dokumen</span></div><div class="st"><b>${lk}</b><span>Sudah ada link (${pc}%)</span><div class="pr"><i style="width:${pc}%"></i></div></div>`;
 let h="";
 t.b.forEach((b,bi)=>{
  const bm=!ql||b.n.toLowerCase().includes(ql);
  const its=b.items.map((it,ii)=>({it,ii})).filter(o=>bm||(o.it.g+" "+o.it.t).toLowerCase().includes(ql));
  if(ql&&!its.length)return;
  const key=tab+bi,isOpen=open.has(key)||ql;
  let li="",pg=null;
  its.forEach(({it,ii})=>{
   if(edit){li+=`<li class="ed"><input class="ig" data-f="ig" data-b="${bi}" data-i="${ii}" value="${esc(it.g)}" placeholder="Kelompok (opsional)"><input class="it" data-f="it" data-b="${bi}" data-i="${ii}" value="${esc(it.t)}"><input class="iu" data-f="iu" data-b="${bi}" data-i="${ii}" value="${esc(it.u)}" placeholder="https://link-dokumen"><button class="x" data-a="di" data-b="${bi}" data-i="${ii}" title="Hapus">✕</button></li>`;return}
   if(it.g&&it.g!==pg)li+=`<li class="g">${esc(it.g)}</li>`;pg=it.g;
   li+=`<li><span class="t">${esc(it.t)}</span>${ok(it.u)?`<a class="go" href="${esc(it.u)}" target="_blank" rel="noopener">Buka ↗</a>`:`<span class="no">Belum ada link</span>`}</li>`;
  });
  const head=edit?`<div class="hd ed"><input data-f="bn" data-b="${bi}" value="${esc(b.n)}" placeholder="Nama bidang"><input data-f="bu" data-b="${bi}" value="${esc(b.u)}" placeholder="Link utama bidang (folder)"><button class="x" data-a="db" data-b="${bi}">Hapus bidang</button></div>`
   :(ok(b.u)?`<a class="go big" href="${esc(b.u)}" target="_blank" rel="noopener">Buka folder bidang ↗</a>`:"");
  const n=b.items.filter(i=>ok(i.u)).length;
  h+=`<details data-k="${key}" ${isOpen?"open":""}><summary><span>${esc(b.n)}</span><small>${n}/${b.items.length} link</small></summary><div class="bd">${head}<ul>${li}</ul>${edit?`<button class="add" data-a="ai" data-b="${bi}">+ Tambah item</button>`:""}</div></details>`;
 });
 $("#grid").innerHTML=h||`<div class="empty">Tidak ada hasil untuk “${esc(q)}”.</div>`;
 $("#ab").style.display=edit?"":"none";
 $("#be").classList.toggle("on",edit);$("#be").textContent=edit?"✓ Selesai Edit":"✎ Mode Edit";
}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,b=+el.dataset.b,i=+el.dataset.i,t=cur();
 if(a==="tab"){tab=el.dataset.id}
 else if(a==="ai"){const it=t.b[b].items;it.push({g:it.length?it[it.length-1].g:"",t:"Item baru",u:""});open.add(tab+b)}
 else if(a==="di"){t.b[b].items.splice(i,1)}
 else if(a==="db"){t.b.splice(b,1);open.clear()}
 else return;
 save();render();
});
document.addEventListener("change",e=>{
 const f=e.target.dataset.f;if(!f)return;
 const b=+e.target.dataset.b,i=+e.target.dataset.i,bd=cur().b[b];let v=e.target.value.trim();
 if(f==="bn")bd.n=v;
 else if(f==="bu"||f==="iu"){if(v&&!/^https?:\/\//i.test(v))v="https://"+v;e.target.value=v;if(f==="bu")bd.u=v;else bd.items[i].u=v}
 else if(f==="it")bd.items[i].t=v;else if(f==="ig")bd.items[i].g=v;
 save();
});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?open.add(k):open.delete(k)}},true);
$("#q").addEventListener("input",e=>{q=e.target.value;render()});
$("#be").onclick=()=>{edit=!edit;render()};
$("#tc").addEventListener("input",e=>{cur().c=e.target.value;save();render()});
$("#ab").onclick=()=>{cur().b.push({n:"BIDANG BARU",u:"",items:[{g:"",t:"Item baru",u:""}]});open.add(tab+(cur().b.length-1));save();render()};
$("#bk").onclick=()=>{$("#ta").value=JSON.stringify(S);$("#dlg").showModal()};
$("#cl").onclick=()=>$("#dlg").close();
$("#cp").onclick=()=>{$("#ta").select();try{navigator.clipboard.writeText($("#ta").value)}catch(e){document.execCommand("copy")}};
$("#sd").onclick=()=>{$("#ta").value=JSON.stringify(seed())};
$("#ap").onclick=()=>{try{const d=JSON.parse($("#ta").value);if(!Array.isArray(d)||!d.length)throw 0;S=d;tab=S[0].id;open.clear();save();render();$("#dlg").close()}catch(e){$("#ta").value="Data tidak valid. Tempel data hasil Backup."}};
render();
</script>
</body>
</html>
